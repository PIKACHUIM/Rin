#:schema node_modules/wrangler/config-schema.json
# 仓库内的通用配置模板（供 Cloudflare Deploy Button / 首次部署使用）。
# 本机部署请改用 wrangler.local.toml（已 gitignore），命令：
#   wrangler deploy --config wrangler.local.toml
#
# 敏感项（JWT_SECRET / RIN_GITHUB_CLIENT_* / S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY）
# 用 `wrangler secret put <KEY>` 写入，不要放进 [vars]，否则会覆盖线上密钥。
name = "rinblogs-work"
main = "server/src/_worker.ts"
compatibility_date = "2026-01-20"
compatibility_flags = ["nodejs_compat"]

# 自定义域名路由（示例；同一账号内的 zone）
# routes = [
#   { pattern = "blog.example.com/*", zone_name = "example.com" },
#   { pattern = "api.example.com/*", zone_name = "example.com" }
# ]

# 前端与接口同一个 Worker：静态资源走 ASSETS，接口走 /api
[assets]
directory = "./dist/client"
binding = "ASSETS"

[observability]
enabled = true

# Workers Free 计划每账号 5 个 cron 名额，名额不足时保持注释
# [triggers]
# crons = ["*/20 * * * *"]

[vars]
NAME = "Rin"
DESCRIPTION = "A lightweight personal blogging system"
AVATAR = ""
PAGE_SIZE = "5"

[[d1_databases]]
binding = "DB"
database_name = "rinblogs-data"
database_id = "<D1_DATABASE_ID>"

[ai]
binding = "AI"

[[queues.producers]]
binding = "TASK_QUEUE"
queue = "rinblogs-work-tasks"

[[queues.consumers]]
queue = "rinblogs-work-tasks"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[placement]
mode = "smart"
