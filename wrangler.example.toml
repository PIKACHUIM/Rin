#:schema node_modules/wrangler/config-schema.json
# 复制为 wrangler.toml 后按需修改（wrangler.toml 不入库，避免提交本地域名与资源 ID）
# 敏感项（JWT_SECRET / RIN_GITHUB_CLIENT_* / S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY）
# 用 `wrangler secret put <KEY>` 写入，不要放进 [vars]，否则会覆盖线上密钥。
name = "rinblogs-work"
main = "server/src/_worker.ts"
compatibility_date = "2026-01-20"
compatibility_flags = ["nodejs_compat"]
account_id = "<CLOUDFLARE_ACCOUNT_ID>"

# 前端与接口同一个 Worker：静态资源走 ASSETS，接口走 /api
# 自定义域名示例（同一账号内的 zone；不写则只走 workers.dev）
# routes = [
#   { pattern = "coding.example.com/*", zone_name = "example.com" },
#   { pattern = "api.example.com/*", zone_name = "example.com" }
# ]

[assets]
directory = "./dist/client"
binding = "ASSETS"

[observability]
enabled = true

# Workers Free 计划每账号仅 5 个 cron 名额，名额不足时先注释掉
# [triggers]
# crons = ["*/20 * * * *"]

[vars]
NAME = "Rin"
DESCRIPTION = "A lightweight personal blogging system"
AVATAR = ""
PAGE_SIZE = "5"
FRONTEND_URL = "https://your-domain.com/"
S3_FOLDER = "images/"
S3_CACHE_FOLDER = "cache/"
S3_REGION = "auto"
S3_ENDPOINT = ""
S3_ACCESS_HOST = ""
S3_BUCKET = ""
S3_FORCE_PATH_STYLE = "false"
# s3: 缓存写 S3/R2；database: 缓存写 D1（无需对象存储）
CACHE_STORAGE_MODE = "s3"
WEBHOOK_URL = ""
RSS_TITLE = ""
RSS_DESCRIPTION = ""

[[d1_databases]]
binding = "DB"
database_name = "rinblogs-data"
database_id = "<D1_DATABASE_ID>"

[ai]
binding = "AI"

[[queues.producers]]
binding = "TASK_QUEUE"
queue = "rinblogs-work-tasks"

[[queues.consumers]]
queue = "rinblogs-work-tasks"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[placement]
mode = "smart"
